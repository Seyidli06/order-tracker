name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile project
        run: ./mvnw clean compile

      - name: Run stable backend tests
        run: >
          ./mvnw
          -Dtest=AuthServiceTest,AuthControllerTest,JwtServiceTest,OrderServiceTest,OrderStatusTransitionValidatorTest,OrderControllerTest,CreateOrderRequestTest,SecurityIntegrationTest,WebhookOrderStatusHandlerTest,RateLimitFilterTest          test
      - name: Check whitespace errors
        run: git diff --check