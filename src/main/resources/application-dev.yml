spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/order_tracker}
    username: ${DB_USERNAME:order_tracker}
    password: ${DB_PASSWORD:order_tracker_dev}

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    show-sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false